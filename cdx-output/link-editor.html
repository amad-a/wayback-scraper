<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Pal Online Link Edit Test</title>
  </head>
  <body>
    <iframe id="frame" src="/" width="500" height="500"> </iframe>

    <button id="no-decoration" onclick="decorate(this.id)">
      No Decoration
    </button>

    <button id="cross-out" onclick="decorate(this.id)">
      Cross Out
    </button>

    <button id="not-allowed" onclick="decorate(this.id)">
      Cursor Not Allowed
    </button>

    <div>
      Current selection:
      <span id="current-selection">no-decoration</span>
    </div>

    <script>
      let linkOption = 'no-decoration';

      const styles = {
        'no-decoration': 'style="pointer-events: none;"',
        'cross-out':
          'style="pointer-events: none; text-decoration: line-through"',
        'not-allowed':
          'style="pointer-events: auto; cursor: not-allowed"',
      };

      const frame = document.getElementById('frame');
      frame.onload = function () {
        console.log(
          'New page loaded:',
          this.contentWindow.location.href,
        );
      };

      function decorate(option) {
        document.getElementById('current-selection').innerHTML =
          option;

        const iframeDoc =
          frame.contentDocument || frame.contentWindow.document;

        iframeDoc.body.innerHTML =
          iframeDoc.body.innerHTML.replaceAll(
            /style=["']([^"']*pointer-events:\s*\w+;[^"']*)["']/g,
            styles[option],
          );
      }
    </script>
  </body>
</html>
