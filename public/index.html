<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Palestine Online</title>
    <!-- What search engines and link previews show. For a ?p= link the server rewrites
         the title, description, canonical address and og: tags for that archived page
         (see pageMeta in src/serve.js); these are the archive's own. -->
    <meta name="description" content="Palestine Online is a curated archive of websites created by Palestinians or about Palestine in the late 90s to early-mid 2000s, sourced from the Internet Archive’s Wayback Machine. The project traces how the world wide web has played a role in Palestinian self advocacy and culture preservation, and is an attempt to create a free, interactive archive that revitalizes and makes newly visible the digital contributions and culture of oppressed peoples." />
    <link rel="canonical" href="https://palestineonline.net/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Palestine Online" />
    <meta property="og:title" content="Palestine Online" />
    <meta property="og:description" content="Palestine Online is a curated archive of websites created by Palestinians or about Palestine in the late 90s to early-mid 2000s, sourced from the Internet Archive’s Wayback Machine. The project traces how the world wide web has played a role in Palestinian self advocacy and culture preservation, and is an attempt to create a free, interactive archive that revitalizes and makes newly visible the digital contributions and culture of oppressed peoples." />
    <meta property="og:url" content="https://palestineonline.net/" />
    <meta property="og:image" content="https://palestineonline.net/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The wallpaper, chosen before the first paint: the remembered tile, or a random
         one on a first visit. Inline and ahead of the stylesheets so it runs at once;
         left to app/wallpaper.js, the stylesheet's default tile showed for a third of
         a second first. The server fills in the tile list. Clicking the background
         is handled in app/wallpaper.js. -->
    <script type="application/json" id="wallpaper-tiles">[]</script>
    <script>
      (function () {
        var tiles = [];
        var name = '';
        try {
          tiles = JSON.parse(document.getElementById('wallpaper-tiles').textContent);
        } catch (e) {}
        try {
          name = localStorage.getItem('palestine-online:wallpaper') || '';
        } catch (e) {}
        if (tiles.indexOf(name) === -1) {
          name = tiles.length ? tiles[Math.floor(Math.random() * tiles.length)] : '';
        }
        if (!name) return;
        var url = '/assets/tiles/' + encodeURIComponent(name);
        document.documentElement.setAttribute('data-wallpaper', name);
        document.documentElement.style.setProperty('--wallpaper', "url('" + url + "')");
        new Image().src = url; // fetched now, alongside the stylesheets
      })();
    </script>

    <!-- 98.css draws the Windows 98 parts; theme.css is the site's colours, edges and
         type on top of it, shared with the archive index; layout.css and explorer.css
         are the shell itself. -->
    <link href="./vendor/98.css/98.css" rel="stylesheet" type="text/css" />
    <link href="./styles/theme.css" rel="stylesheet" type="text/css" />
    <link href="./styles/layout.css" rel="stylesheet" type="text/css" />
    <link href="./styles/explorer.css" rel="stylesheet" type="text/css" />

    <link
      rel="icon"
      href="./assets/icons/palestine-flag-16x16.png"
      sizes="16x16"
      type="image/png"
    />
    <link
      rel="icon"
      href="./assets/icons/palestine-flag-32x32.png"
      sizes="32x32"
      type="image/png"
    />

    <!-- No user-scalable=no: iOS has ignored it since 10 and Chrome ignores it
         too, so it only ever read as an intent. The chrome's double-tap zoom, and
         on touch screens its pinch zoom, are turned off in explorer.css
         (touch-action) and app/api.js (blockShellPinch) instead; the archived page
         in the frame keeps both.

         maximum-scale=1 stops iPhone Safari zooming in when the address bar is
         tapped, which it does to any text box under 16px. iOS still lets you
         pinch-zoom past it; Chrome on Android honours it, and loses page pinch-zoom. -->
    <meta name="viewport" content="width=device-width, maximum-scale=1" />

    <script type="module" src="./app/main.js"></script>
  </head>
  <body class="">
    <!-- data-nosnippet: the window's chrome -- toolbar labels, panels, status bar -- is
         never quoted as a search result's summary; the description above is. -->
    <div class="window-container window" data-nosnippet>
      <div class="title-bar" style="touch-action: none">
        <div class="title-bar-text window-title"></div>
        <div class="title-bar-controls">
          <button aria-label="Minimize"></button>
          <button aria-label="Maximize"></button>
          <button aria-label="Close"></button>
        </div>
      </div>

      <div class="toolbars">
        <div class="toolbar" id="menu-bar-toolbar">
          <div class="toolbar-drag-handle"></div>
        </div>
        <div class="toolbar" id="standard-buttons-toolbar">
          <div class="toolbar-drag-handle"></div>
          <div id="internet-buttons" style="">
            <div class="toolbar-compound-button-wrapper">
              <button class="toolbar-button lightweight back-button">
                <span class="label-text">Back</span>
                <div
                  class="icon"
                  style="background-position: 0px 0px"
                ></div>
              </button>
              <button
                class="toolbar-dropdown-button lightweight back-dropdown-button hidden"
                disabled="disabled"
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  xmlns="http://www.w3.org/2000/svg"
                  style="
                    fill: currentColor;
                    display: inline-block;
                    vertical-align: middle;
                  "
                >
                  <path
                    style="
                      transform: rotate(90deg);
                      transform-origin: center;
                    "
                    d="m6 4 4 4-4 4z"
                  ></path>
                </svg>
              </button>
            </div>
            <div class="toolbar-compound-button-wrapper">
              <button
                class="toolbar-button lightweight forward-button"
              >
                <span class="label-text">Forward</span>
                <div
                  class="icon"
                  style="background-position: -20px 0px"
                ></div>
              </button>
              <button
                class="toolbar-dropdown-button lightweight forward-dropdown-button hidden"
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  xmlns="http://www.w3.org/2000/svg"
                  style="
                    fill: currentColor;
                    display: inline-block;
                    vertical-align: middle;
                  "
                >
                  <path
                    style="
                      transform: rotate(90deg);
                      transform-origin: center;
                    "
                    d="m6 4 4 4-4 4z"
                  ></path>
                </svg>
              </button>
            </div>
            <button class="toolbar-button lightweight hidden">
              <span class="label-text">Stop</span>
              <div
                class="icon"
                style="background-position: -40px 0px"
              ></div>
            </button>
            <button class="toolbar-button lightweight home-button">
              <span class="label-text">Home</span>
              <div
                class="icon"
                style="background-position: -80px 0px"
              ></div>
            </button>
            <hr aria-orientation="vertical" />
            <button
              id="favorites"
              class="toolbar-button lightweight toggle favorites-button"
            >
              <span class="label-text">Favorites</span>
              <div
                class="icon"
                style="background-position: -120px 0px"
              ></div>
            </button>
            <button
              id="history"
              class="toolbar-button lightweight toggle history-button"
            >
              <span class="label-text">History</span>
              <div
                class="icon"
                style="background-position: -240px 0px"
              ></div>
            </button>
            <button
              id="random"
              class="toolbar-button lightweight random-button"
            >
              <span class="label-text">Random</span>
              <div
                class="icon"
                style="background-position: -640px 0px"
              ></div>
            </button>
            <hr aria-orientation="vertical" />
            <button
              id="source"
              class="toolbar-button lightweight toggle search-button"
            >
              <span class="label-text">Source</span>
              <div
                class="icon"
                style="background-position: -100px 0px"
              ></div>
            </button>
            <button id="share" class="toolbar-button lightweight share-button">
              <span class="label-text">Share</span>
              <div
                class="icon"
                style="background-position: -260px 0px"
              ></div>
            </button>
            <button class="toolbar-button lightweight print-button">
              <span class="label-text">Print</span>
              <div
                class="icon"
                style="background-position: -140px 0px"
              ></div>
            </button>
          </div>
        </div>
        <div class="toolbar" id="address-bar-toolbar">
          <div class="toolbar-drag-handle"></div>
          <div id="address-bar">
            <!-- @TODO: d access key -->
            <label for="address">Address</label>
            <div class="address-container">
              <div id="address-compound-input" class="inset-deep">
                <img
                  id="address-icon"
                  width="16"
                  height="16"
                  src="./assets/icons/page-16x16.png"
                  alt=""
                />
                <input
                  type="text"
                  id="address-input"
                  autocomplete="one-time-code"
                />
                <div id="favorite-star"></div>

                <button id="address-dropdown-button">
                  <!-- The arrow from 98.css's scrollbar down button, pixel for pixel and
                       in the same place, so it matches the list's scrollbar below it. -->
                  <svg
                    width="16"
                    height="17"
                    viewBox="0 0 16 17"
                    xmlns="http://www.w3.org/2000/svg"
                    shape-rendering="crispEdges"
                    aria-hidden="true"
                  >
                    <path d="M11 6H4v1h1v1h1v1h1v1h1V9h1V8h1V7h1V6z"></path>
                  </svg>
                </button>
                <!-- TODO: functional dropdown, autocompleting file/folder paths -->
              </div>
              <!-- The outer box only clips; the list inside carries the sunken border and
                   is what slides open (see #dropdown in explorer.css). -->
              <div id="dropdown" class="dropdown hidden">
                <div class="dropdown-content inset-deep"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="favorites hidden">
        <div class="favorites-list inset-deep">
          <div class="favorites-toolbar toolbars">
            <div class="toolbar">Favorites</div>
            <div class="title-bar-controls panel-close">
              <button id="favorites-exit" aria-label="Close"></button>
            </div>
          </div>
          <div class="favorites-entries"></div>
        </div>
      </div>
      <div class="history hidden">
        <div class="history-list inset-deep">
          <div class="history-toolbar toolbars">
            <div class="toolbar">History</div>
            <div class="title-bar-controls panel-close">
              <button id="history-exit" aria-label="Close"></button>
            </div>
          </div>
          <div class="history-entries"></div>
        </div>
      </div>
      <div id="content" class="inset-deep">
        <iframe
          id="frame"
          sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals"
          src="/home.html"
          style="
            min-width: 0px;
            min-height: 0px;
            flex: 1 1 1px;
            border: 0px;
          "
        ></iframe>
      </div>
      <div id="status-bar">
        <!-- Shown only on pages that link to restored audio; see app/webamp.js. -->
        <button id="status-bar-audio" type="button" hidden>
          <img src="./assets/icons/loudspeaker-rays-16x16.png" width="16" height="16" alt="" />
          <span id="status-bar-audio-label"></span>
        </button>
        <div
          id="status-bar-left"
          class="inset-shallow"
          style="display: block"
        >
          <img
            id="status-bar-left-icon"
            style="display: none"
            width="16"
            height="16"
            src="./assets/icons/folder-16x16.png"
            alt=""
          />
          <span id="status-bar-left-text"></span>
        </div>
        <div
          id="status-bar-right"
          class="inset-shallow"
          style="display: flex"
        >
          <img
            id="status-bar-right-icon"
            style=""
            width="16"
            height="16"
            src="./assets/icons/zone-internet-16x16.png"
            alt=""
          />
          <span id="status-bar-right-text"></span>
        </div>
        <!-- for menu descriptions, replace left/middle/right layout with non-inset, singular area -->
      </div>
    </div>
  </body>
</html>
