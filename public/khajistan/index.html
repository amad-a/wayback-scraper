<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khajistan Digital Archive</title>
<link rel="stylesheet" href="/khajistan/styles.css">
</head>
<body>
<header>
  <h1>Khajistan Digital Archive</h1>
  <div id="summary" class="muted">loading…</div>
</header>

<main>
  <!-- three filter axes -->
  <aside id="filters">
    <section>
      <h2>Media <button class="clear" data-clear="kind">clear</button></h2>
      <ul id="kinds" class="facet"></ul>
    </section>
    <section>
      <h2>Region <button class="clear" data-clear="region">clear</button></h2>
      <ul id="regions" class="facet"></ul>
    </section>
    <section>
      <h2>Account <button class="clear" data-clear="account">clear</button></h2>
      <ul id="accounts" class="facet"></ul>
    </section>
    <section>
      <h2>Tags <button class="clear" data-clear="tags">clear</button></h2>
      <ul id="tags" class="facet"></ul>
    </section>
  </aside>

  <!-- results -->
  <section id="feed-wrap">
    <div id="feed-meta" class="muted"></div>
    <div id="feed"></div>
    <!-- Watched by an IntersectionObserver; scrolling it into view loads the
         next page. Kept outside #feed so the grid layout doesn't size it. -->
    <div id="sentinel"></div>
    <div id="feed-end" class="muted small" hidden>end of results</div>
  </section>

  <!-- detail -->
  <aside id="detail" class="empty">
    <p class="muted">Select an item.</p>
  </aside>
</main>

<script type="module" src="/khajistan/app.js"></script>
</body>
</html>
