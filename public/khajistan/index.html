<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khajistan Digital Archive</title>
<link rel="stylesheet" href="/khajistan/styles.css">
</head>
<body>
<header>
  <h1>Khajistan Digital Archive</h1>
  <div id="summary" class="muted">loading…</div>
</header>

<main>
  <!-- browse: filters collapse into the top of the feed, so the column reads as
       one thing you scroll rather than two panes competing for height -->
  <aside id="left">
    <details id="filters" open>
      <summary>
        <span>Filters</span>
        <span id="filter-state" class="muted small"></span>
      </summary>
      <div id="filter-body">
        <section>
          <h2>Media <button class="clear" data-clear="kind">clear</button></h2>
          <ul id="kinds" class="facet"></ul>
        </section>
        <section>
          <h2>Region <button class="clear" data-clear="region">clear</button></h2>
          <ul id="regions" class="facet"></ul>
        </section>
        <section>
          <h2>Account <button class="clear" data-clear="account">clear</button></h2>
          <ul id="accounts" class="facet"></ul>
        </section>
        <section>
          <h2>Tags <button class="clear" data-clear="tags">clear</button></h2>
          <ul id="tags" class="facet"></ul>
        </section>
      </div>
    </details>

    <section id="feed-wrap">
      <div id="feed-meta" class="muted"></div>
      <div id="feed"></div>
      <!-- Watched by an IntersectionObserver; scrolling it into view loads the
           next page. Kept outside #feed so the grid layout doesn't size it.
           The observer roots on #left, which is the element that scrolls. -->
      <div id="sentinel"></div>
      <div id="feed-end" class="muted small" hidden>end of results</div>
    </section>
  </aside>

  <!-- the table: click a feed item to drop it here, drag to arrange. Positions
       are shared and persist, so the arrangement is the artifact. -->
  <section id="board">
    <div id="board-bar">
      <span class="muted small" id="board-count">empty table</span>
      <span class="muted small" id="board-status">connecting…</span>
    </div>
    <div id="board-surface">
      <p id="board-empty" class="muted">Click anything in the feed to lay it out here.</p>
    </div>
  </section>

  <!-- detail -->
  <aside id="detail" class="empty">
    <p class="muted">Select an item.</p>
  </aside>
</main>

<script type="module" src="/khajistan/app.js"></script>
</body>
</html>
