<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #dos { width: 100%; height: 100%; }
  /* js-dos sizes the canvas from a zoomed measurement, so under the shell's page zoom

  #dos canvas {

<div id="dos"></div>
<div id="paused" hidden="">Paused - Click to resume</div>
<script>
  // js-dos locks the keyboard on click, which only a top-level page may do; inside
  // the shell's frame the call throws.
  if (navigator.keyboard) navigator.keyboard.lock = function () { return Promise.resolve(); };

  // Loaded from script rather than <link>/<script src>: the scraper's relinking pass
  // reads root-relative attributes as this site's own files and would rewrite them.
  var JS_DOS = '/vendor/js-dos/';

  // The emulator keeps a whole CPU core busy for as long as it runs, whatever the cycles
  // setting -- even at an idle DOS prompt -- and pausing it drops that to almost
  // nothing. So it runs only while someone is playing.
  function pauseWhenIdle(ci) {
    var note = document.getElementById('paused');
    var paused = false;
    function setPaused(pause) {
      if (pause === paused) return;
      paused = pause;
      if (pause) ci.pause();
      else ci.resume();
      note.hidden = !pause;
    }
    // Leaving -- the shell's toolbar, another window, another tab -- pauses it, but only
    // once the game has been played: arriving from the site's link leaves focus in the
    // shell, and the intro should run rather than wait behind the notice. Only a click
    // in the game resumes it. Getting focus back is not enough: returning to the tab
    // refocuses the game, which would resume it before the notice was ever seen.
    var played = false;
    window.addEventListener('blur', function () { if (played) setPaused(true); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) setPaused(true);
    });
    // A left click is also the space bar -- the game's start key -- unless it is the
    // click that resumes the game. Held for as long as the button is.
    var KBD_SPACE = 32;
    var spaceDown = false;
    window.addEventListener('pointerdown', function (event) {
      played = true;
      if (paused) {
        setPaused(false);
        return;
      }
      if (event.button !== 0) return;
      spaceDown = true;
      ci.sendKeyEvent(KBD_SPACE, true);
    }, true);
    function releaseSpace() {
      if (!spaceDown) return;
      spaceDown = false;
      ci.sendKeyEvent(KBD_SPACE, false);
    }
    window.addEventListener('pointerup', releaseSpace, true);
    window.addEventListener('pointercancel', releaseSpace, true);
    window.addEventListener('blur', releaseSpace);
    window.addEventListener('keydown', function () { played = true; }, true);
  }
  var css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = JS_DOS + 'js-dos.css';
  document.head.appendChild(css);
  var script = document.createElement('script');
  script.src = JS_DOS + 'js-dos.js';
  script.onload = function () {
    Dos(document.getElementById('dos'), {
      url: '/sites/damascus-online.com/stonethrowers/game.jsdos',
      pathPrefix: JS_DOS + 'emulators/',
      autoStart: true,
      kiosk: true,
      noCloud: true,
      noNetworking: true,
      onEvent: function (event, ci) {
        if (event === 'ci-ready') pauseWhenIdle(ci);
      },
    });
  };
  document.body.appendChild(script);
</script>
