<h3>Deir Yassin Remembered</h3>
Deir Yassin Remembered was founded to do justice to the victims of
the Deir Yassin Massacre.  Our goal is to build a memorial at Deir Yassin.  We
are not a political organization and have no other stated or implied
goals.
