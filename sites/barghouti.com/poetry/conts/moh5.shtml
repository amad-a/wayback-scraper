<style id="print-size">@media print { @page { size: 176mm 240mm; } }</style><link id="dead-links-css" rel="stylesheet" href="/sites/_wayback/dead-links.css"><script id="dead-links-js" src="/sites/_wayback/dead-links.js"></script></head><body data-wayback-url="https://web.archive.org/web/20010419160446id_/http://www.barghouti.com:80/poetry/conts/moh5.shtml"><font size="+2">WONDER</font><br><br>
Here, where the moon slips<br>
its silver streaks through my hair<br><br>
I wear my sweat and pray<br>
to tumble over my skin<br><br>
I venture the hall of sorrow<br>
with life<br>
at its centre, I hear<br>
the echoes of the silver streak<br>
that's lost in the why of memories.<br>
