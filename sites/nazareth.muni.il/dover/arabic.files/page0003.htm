absolute;z-index:37;left:581px;top:612px;width:157px;height:426px"><img width="157" height="426" src="/sites/nazareth.muni.il/dover/arabic.files/image075.gif" alt="תיבת טקסט: تقع المنطقة الصناعية تسيبوريت (مساحتها 5500 دونم وسعت مؤخراً ب- 2000 دونم) بين البلدات الرينة, المشهد, كفركنا, ولكنها تابعة إدارياً وتنظيمياً لمنطقة نفوذ نتسيرت عيليت!! على الرغم من انعدام التواصل الجغرافي معها!
على عكس السياسة المعلنة لوزارتي الداخلية والتجارة والصناعة بتشجيع إقامة مناطق صناعية مشتركة رفضت جميع طلبات البلدية للإنضمام كشريكة في المنطقة.. والغرابة في الأمر أن البلدية وصلتها ردود مبدئية ايجابية في الماضي حول طلبها من وزير الصناعة والتجارة ومن ديوان رئيس الحكومة وتم رفض طلباتها الرسمية.
ويقع بجوار المنطقة الصناعية تسيبوريت قطعة ارض بدون تبعية بلدية تقدمت بلدية الناصرة بطلب الحصول عليها لتطويرها كمنطقة صناعية وكان الرد بسد الطريق عن طريق ضمها مؤخراً لنتسيرت عيليت.
ما ذكر أعلاه يؤكد مجدداً التمييز القومي الصارخ والمطلوب شن حملة واسعة لتغيير هذه السياسة.
