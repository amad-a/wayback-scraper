هذا الأمر يستوجب العمل لتغيير التوجه القائم, وتحييد العامل السياسي العام والسياسي الحزبي, الذي يخرج الوسط العربي من دائرة الأفضليات والاهتمامات الحكومية, وبناء مقاييس متساوية وموضوعية تأخذ بعين الاعتبار الوضع الاجتماعي – الاقتصادي ومستوى التطور القائم لغرض إقرار واختيار مناطق الأفضلية.
في حال تنفيذ هذا الأمر, من المؤكد بأن الناصرة ستحصل على منطقة افضلية في كافة المجالات.
على مدار كل السنوات الماضية حصلت نتسيرت عيليت على مكانة منطقة أفضلية &quot; أ &quot;, إن لم يكن في كافة المجالات, فبأغلبها, في الوقت الذي جرى حرمان الناصرة من ذلك, الأمر الذي يفرض حالة عامة من التنافس غير المتساوي وغير المنصف, وإعطاء نتسيرت عيليت فرص كبيرة للتطوير, جزء كبير منها على حساب الناصرة.
