 <v:textbox style='mso-column-margin:5.7pt' inset="2.85pt,2.85pt,2.85pt,2.85pt">
  <div dir=ltr>
  <p class=MsoNormal style='text-align:right;direction:rtl;unicode-bidi:embed'><span
  style='mso-ascii-font-family:"Times New Roman";mso-latin-font-family:"Times New Roman";
  mso-greek-font-family:"Times New Roman";mso-cyrillic-font-family:"Times New Roman";
  language:HE;mso-bidi-language:HE;direction:rtl;unicode-bidi:normal;
  mso-font-cs-format:-1'>העיר נצרת היא העיר הגדולה באזור והעיר הערבית הגדולה
  ביותר בישראל. העיר מונה היום כ- 70,000 תושבים, על תחום שיפוט של 14,200 דונם. <o:p></o:p></span></p>
  <p class=MsoNormal style='text-align:right;direction:rtl;unicode-bidi:embed'><span
  style='mso-ascii-font-family:"Times New Roman";mso-latin-font-family:"Times New Roman";
  mso-greek-font-family:"Times New Roman";mso-cyrillic-font-family:"Times New Roman";
  language:HE;mso-ansi-language:EN;direction:rtl;unicode-bidi:normal;
  mso-font-cs-format:-1'><![if !supportEmptyParas]>&nbsp;<![endif]><o:p></o:p></span></p>
  <p class=MsoNormal style='text-align:right;direction:rtl;unicode-bidi:embed'><span
  dir=ltr style='font-family:"Times New Roman";mso-ascii-font-family:"Times New Roman";
  mso-latin-font-family:"Times New Roman";mso-greek-font-family:"Times New Roman";
  mso-cyrillic-font-family:"Times New Roman";language:EN;mso-ansi-language:
  EN;direction:ltr;unicode-bidi:embed'><span style='mso-spacerun:yes'> </span></span><span
  style='mso-ascii-font-family:"Times New Roman";mso-latin-font-family:"Times New Roman";
  mso-greek-font-family:"Times New Roman";mso-cyrillic-font-family:"Times New Roman";
  language:HE;mso-ansi-language:EN;mso-bidi-language:HE;direction:rtl;
  unicode-bidi:normal;mso-font-cs-format:-1'>העיר נצרת היא אחת הערים התיירותיות
  החשובות ביותר, כלכלת העיר נשענה עד היום בעיקר על שני פלחי שוק, תיירות, מסחר
  ומלאכה מצד אחד ועיר שירותים לכלל האזרחים באזור מצד שני. שוק התיירות הוא פלח
  לא יציב במיוחד באזור שלנו, והוכחה על כך עומדת בפנינו היום. <o:p></o:p></span></p>
  <p class=MsoNormal style='text-align:right;direction:rtl;unicode-bidi:embed'><span
  style='mso-ascii-font-family:"Times New Roman";mso-latin-font-family:"Times New Roman";
  mso-greek-font-family:"Times New Roman";mso-cyrillic-font-family:"Times New Roman";
  language:HE;mso-ansi-language:EN;mso-bidi-language:HE;direction:rtl;
  unicode-bidi:normal;mso-font-cs-format:-1'>הממצאים מצביעים על כך שהעיר נצרת
  ספגה המכה הקשה ביותר בתחום התיירות, כשתפוסת בתי המלון ירדה ב- 94% לעומת שנת
  2000. דבר אשר משליך באופן מיידי על המצב החברתי הכלכלי של האוכלוסייה ועל
  ההכנסות לקופת העירייה — ( מאחר ונסגרו שלושת בתי המלון החדשים והגדולים ביותר
