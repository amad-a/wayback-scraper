  "Times New Roman";language:HE;mso-bidi-language:HE;direction:rtl;unicode-bidi:
  normal;mso-font-cs-format:-1'>אחד הכלים שפותחו ע“י משרדי הממשלה לצורך העברות
  תקציבים מיוחדים ועידוד פיתוח והשקעות הוא, הגדרת אזורי עדיפות לאומית. חוץ
  מהתקופה של ממשלת רבין, תמיד נעדרו הישובים הערבים מרשימת אזורי העדיפות.<o:p></o:p></span></p>
  <p class=MsoBodyText3 style='text-align:right;direction:rtl;unicode-bidi:
  embed'><span style='mso-ascii-font-family:"Times New Roman";mso-latin-font-family:
  "Times New Roman";mso-greek-font-family:"Times New Roman";mso-cyrillic-font-family:
  "Times New Roman";language:HE;mso-bidi-language:HE;direction:rtl;unicode-bidi:
  normal;mso-font-cs-format:-1'>ע“י כלי זה מקבלים הישובים הנמצאים באזורי עדיפות
  לאומית הטבות ממשרדי הממשלה השונים , הן באופן ישיר לעיריות והן הטבות הניתנות
  באופן ישיר לתושבים ולמשקיעים, כגון, משכנתאות ומענקים גבוהים יותר לרוכשי
  הדירות, ומענקי עידוד השקעות לעסקים חדשים ע“י הגדרתם כמפעלים מאושרים אם קמים
  באזור פיתוח א‘. דברים אלה לא ניתנים לישובים במגזר הערבי וכך נמנעת כל אפשרות
  שהישובים הערבים יוכלו להתחרות </span></p>
  </div>
