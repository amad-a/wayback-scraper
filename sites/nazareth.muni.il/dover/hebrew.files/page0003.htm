  <p class=MsoNormal style='text-align:right;direction:rtl;unicode-bidi:embed'><span

  mso-greek-font-family:"Times New Roman";mso-cyrillic-font-family:"Times New Roman";
  language:HE;mso-bidi-language:HE;direction:rtl;unicode-bidi:normal;
  mso-font-cs-format:-1'>אזור תעשייה ציפורית שטחו כ– 5500 דונם (לאחרונה סופחו
  לו כ– 2000 דונם),<span style='mso-spacerun:yes'>  </span>נמצא בין הישובים
  רינה, משהד וכפר כנא, אך שייך שיפוטית ותכנונית לנצרת עילית!! על אף שאין קשר
  טרטוריאלי בינו לבין נצרת עילית! בניגוד למדיניות המוצהרת של משרד הפנים ומשרד
  התמ“ס להקמת אזורי תעשייה אזוריים,<span style='mso-spacerun:yes'>  </span>כל
  בקשותיה של עיריית נצרת להיות שותפה יחד עם הכפרים הערביים מסביב, באזור זה
  נדחו!!<o:p></o:p></span></p>
  <p class=MsoNormal style='text-align:right;direction:rtl;unicode-bidi:embed'><span
  style='mso-ascii-font-family:"Times New Roman";mso-latin-font-family:"Times New Roman";
  mso-greek-font-family:"Times New Roman";mso-cyrillic-font-family:"Times New Roman";
  language:HE;mso-bidi-language:HE;direction:rtl;unicode-bidi:normal;
  mso-font-cs-format:-1'>מוזר הוא שעירית נצרת קבלה בעבר התייחסויות חיוביות
  לבקשותיה בכתב, ברמה העקרונית, משר התמ“ס וממשרד ראש הממשלה! אך למעשה הבקשות
  הרשמיות נדחו!!<o:p></o:p></span></p>
  <p class=MsoNormal style='text-align:right;direction:rtl;unicode-bidi:embed'><span
  style='mso-ascii-font-family:"Times New Roman";mso-latin-font-family:"Times New Roman";
  mso-greek-font-family:"Times New Roman";mso-cyrillic-font-family:"Times New Roman";
  language:HE;mso-bidi-language:HE;direction:rtl;unicode-bidi:normal;
  mso-font-cs-format:-1'>באזור היה שטח חסר מעמד מוניציפאלי, שלחלופין בקשה
  עיריית נצרת לקבלו לצורך פיתוח אזור תעשיה, אך הדרך נחסמה ע“י סיפוחו לאחרונה
  לנצרת עילית!<o:p></o:p></span></p>
  <p class=MsoNormal style='text-align:right;direction:rtl;unicode-bidi:embed'><span
  style='mso-ascii-font-family:"Times New Roman";mso-latin-font-family:"Times New Roman";
  mso-greek-font-family:"Times New Roman";mso-cyrillic-font-family:"Times New Roman";
  language:HE;mso-bidi-language:HE;direction:rtl;unicode-bidi:normal;
  mso-font-cs-format:-1'>מצב זה מהווה הוכחה לאפליה הלאומית המשוועת! וקיים צורך
  בקמפיין רחב לשינוי.<o:p></o:p></span></p>
  <p class=MsoNormal style='text-align:right;direction:rtl;unicode-bidi:embed'><span
  style='mso-ascii-font-family:"Times New Roman";mso-latin-font-family:"Times New Roman";
  mso-greek-font-family:"Times New Roman";mso-cyrillic-font-family:"Times New Roman";
  language:HE;mso-bidi-language:HE;direction:rtl;unicode-bidi:normal;
  mso-font-cs-format:-1'>חשוב לציין:<o:p></o:p></span></p>
  <p class=MsoNormal style='text-align:right;direction:rtl;unicode-bidi:embed'><span
  style='mso-ascii-font-family:"Times New Roman";mso-latin-font-family:"Times New Roman";
  mso-greek-font-family:"Times New Roman";mso-cyrillic-font-family:"Times New Roman";
  language:HE;mso-bidi-language:HE;direction:rtl;unicode-bidi:normal;
  mso-font-cs-format:-1'><span dir=rtl></span>1. אין היום שטחים מספיקים שיכולים
  לתת פתרונות לתעשיה בתחום העיר. השטח הצפוני יכול לתת פתרון חלקי קצר טווח בלבד
  (לעסקים קטנים) </span></p>
