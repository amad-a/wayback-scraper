<center><img src="/sites/palestinehistory.com/image/syces.gif" width="250" height="228" border="0" alt="Sykes-Picot agrement"></center>
<p>Britain and France signed a Sykes-Picot Agreement.
Which divided Arab region in to zones of influence.
Lebanon and Syria were assigned to France, Jordan and Iraq to Britain and Palestine to be international.</p>
