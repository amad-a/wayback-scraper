<meta name="description" content="Prisoners Support and Human Rights Association - Addameer is a Jerusalem based Palestinian non-governmental, civil institution which focuses on human rights issues. This Middle Eastern, Palestinian Human Rights Organization is concerned with plight, conditions and needs of Palestinian political prisoners as a result of the middle east conflict (Arab-Israeli Conflict) -in Israeli and PA prisons- both while in detention and upon their release. The center's activities focus on offernig support for Palestinian prisoners, advocating the rights of political prisoners, and working to end torture through monitoring, legal procedures and solidarity campaigns.">
