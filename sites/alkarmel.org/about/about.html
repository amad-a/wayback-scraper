وضعت الكرمل على عاتقها، منذ لحظة صدورها في بيروت عام 1981، إقامة علاقة من التفاعل المعرفي و الابداعي بين الثقافتين العربية والعالمية من ناحية، وتأسيس منبر للابداع الفكري والادبي في شتى صنوف المعرفة الانسانية من ناحية آخرى.
<P>
وفي هذا السياق، حملت اسئلة الثقافة العربية المعاصرة، وانخرطت في قضيتي التحديث والتنوير.  وقد كانت مسيرتها جزءاً من التحوّلات الكبرى التي عصفت بالعالم العربي والقضية الفلسطينية في العقدين الماضيين.
<P>
ففي عام 1982 توقفت "الكرمل" عن الصدور في اعقاب الغزو الاسرائيلي للبنان ثم استأنفت الصدور في عام 1983 من العاصمة القبرصية نيقوسيا حتى عام 1993، واستقر بها المطاف في رام الله بفلسطين حيث واصلت الصدور في عام 1996.
<P>
أسس مجلة الكرمل في بيروت الشاعر محمود درويش ومازال رئيساً لتحريرها ورفيق ترحالها حتى الآن.
