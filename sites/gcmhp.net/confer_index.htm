<p>
<B>Draft Proposal</B>

<P><B>Background:</B>

 <P>The Gaza Community Mental Health Programme (GCMHP) was founded in 1990
to fill the lack of mental health services in the Gaza Strip and to
address the pressing mental health problems caused by decades of Israeli
occupation and the resulting systematic violence. The Programme focuses
on the most vulnerable sectors of the Gazan society, particularly women,
children, and former prisoners.

 <P>In the first decade of its existence, GCMHP watched as Palestinian
society underwent a series of major changes, from the expectant hopes
that accompanied the end of the Intifada and the signing of the Oslo
Accords to the subsequent disappointment and disillusionment when these
hopes for peace went unrealized. During this time, the GCMHP has worked
with the community to ease the burdens of such tremendous anxiety and
heal the wounds of violence and trauma, always adapting to the needs of
the society.

 <P>Since its inception, GCMHP has organized a total of five international
conferences, dealing with a range of issues facing the mental health of
Palestinian society. The first conference was held in 1993 and was
entitled "Mental Health  and the Challenge of Peace." It aimed to
discuss the pressing issues at that time, including the effects of the
Intifada and the rehabilitation of torture victims. Its timing coincided
with the signing of the Oslo Accords, marking a new stage in the history
of Palestinian society. In response to the changing political and social
conditions that followed, GCMHP focused its second conference in 1995 on
"Palestinians in Transition: Rehabilitation and Community Development."

<P>Over the past three years, the GCMHP has organized three conferences.
In October 1997, the Programme's third international conference was held
under the title of "Health and Human Rights. In addition, GCMHP hosted
the Biannual Meeting of the International Association for the Study of
Forced Migration in December 1998. And in November 1999, the Programme
organized its fourth international conference, on "Women in Palestine."

<P><B>Introduction:</B>

 <P>During the years of occupation and the subsequent struggle for peace,
human resources and emotional energy were allocated to the struggle for
independence. As a result, debate on the future political and social
composition of Palestinian society was often deferred. Much of the focus
of the Programme, too, also centered around the more pressing issues of
human rights violations and other indignities suffered by the
Palestinian people. But while rehabilitation has been and continues to
be central to the daily work of the Programme, GCMHP has always
recognized the need for more forward-looking initiatives. It is in this
spirit of anticipation that GCMHP announces its Fifth International
Conference, entitled, "Democracy and Arab Culture."

 <P>GCMHP is committed to the idea that mental health is more than the
absence of illness. Rather, it is the presence of well-being,
facilitated by a stable environment that encourages both personal growth
and social cohesiveness. Daily the Programme finds itself face to face
with the consequences of restrictions on freedom and the denial of
self-determination. For this reason, it is crucial that GCMHP and other
organizations address issues of democracy and Palestinian society during
this critical period, in order to advance a healthy society. And just as
mental well-being rests on the self-determination and free expression
embodied in democracy, so too does a sustainable democratic state
require a healthy polity and a vibrant civil society.

 <P>It is said that Arab society is incapable of democratic life.
Certainly, there is not an abundance of democratic models in the Arab
world to serve as examples for an emerging Palestinian State. Even in
self-proclaimed democratic states where elections are held, dialogue is
obstructed and opposition is either crushed or co-opted. These states
are left with the appearance of democracy, but without its substantive
benefits for the populace and without a strong sense of democratic
values.

 <P>The stunted development of democracy in the Arab world can be partly
attributed to the region's role in the larger international context of
colonialism and domination. The opportunity for self-rule arose only
recently. This is particularly true in the case of Palestine, which was
shuffled between the Ottoman Empire, British Mandate rule, Egyptian
administration, and Israeli occupation. In all its history, Palestine
has never been granted the opportunity to govern itself fully.
Democratic development is understandably difficult when a nation cannot
control its own borders or its own resources. Nonetheless, the
Palestinian people have practiced democracy even during the time of the
Israeli occupation in student unions, syndicates, and political parties.

<P><B>Challenges to Democracy:</B>

 <P>It is important to take this opportunity to critically reflect on Arab
culture from within, with an eye to overcoming obstacles to change.
Culturally, the Arab society has had a conflicting relationship with
democracy. Islam, the primary religion and source of social values for
the region, promotes justice and equality, the building blocks of a
democratic society. Yet fundamentalism has often been criticized as too
willing to stifle opposition and too resistant to certain secular
democratic values. Also, prevalent social norms tend to be centered
around the family or clan. This sometimes leads to neglecting the rights
of individuals. The challenge for Palestinian society is to tailor
democracy to the religious and social values of the region.

 <P>Palestinian society must also face traditional patriarchal structures
before democracy can be realized. Full and equal participation is not
possible when women are denied equal access to resources and education
and when their movement within society is restricted. The family, which
plays such an integral part in Arab society, is the schoolhouse for
democratic values. Thus any discussion about proposed political systems
must include a discussion about the structure of the family and the way
in which children are raised. The family, not the state, will be
responsible for raising a new generation of Palestinians who prize
democracy and embody its values.

 <P>Arab culture must also face the larger remnants of patriarchy, which
often place the society in an uneasy relationship with democracy. In
addition to conflicting tribal loyalties, Arab society also shows a
strong tendency to venerate its leaders, regardless of autocratic
tendencies. Indeed, this could be one possible cause for such
tendencies, as leaders become larger than life and above reproach. These
leaders filled a public need for heroes and supreme leaders, but then
escaped any requirement of accountability.

 <P>The Palestinian society has lived under conditions that will affect it
for generations to come. The cycle of violence in the Palestinian
society has touched all sectors of society and has lead to numerous
problems. If they are not stopped, the violence and trauma that the
people experienced will be one of the major obstacles in the way of
democratization.

<P><B>Conference Objectives:</B>

 <P>The challenges facing Palestinian society, which has lived through a
century of war, dispossession and occupation, exceed even those facing
other Arab nations. GCMHP is acutely aware of the legacy of decades of
hardship and trauma. This conference will discuss how best to fashion a
new generation of Palestinians freed from the burdens and scars of war
and occupation. It is not only a matter of rehabilitating those who have
suffered from torture or injustice, but also, in a larger sense, of
rehabilitating the Palestinian society.

<P>Democratization is not an easy task and requires the full commitment of
society. But this commitment is only possible if we can find a way to
galvanize the public and inject the realm of politics with positive
energy and accountability. In this respect, groups in civil society have
an opportunity to set the example of accountability and transparency and
win back the public trust in governance.

<P><B>How to Achieve the Aims:</B>

 <P>In calling for this conference, it is our hope at GCMHP to promote a
dialogue about democracy in Palestine and the Arab world and to energize
civil society, both locally and internationally, to search for solutions
and work for change. It is essential to study the environment in which
Arabs grow up and determine how the prevalent socialization patterns
affect the development of democracy. Socialization is influenced by the
family and various institutions such as the school, government, media,
politics, and others. In addition, the development of democracy should
be looked upon from a wider cultural perspective to observe the effect
of, among others, religion, economy, war, and dispossession.

<P>This conference will help to find ways to harness the unique culture
heritage of Palestine to facilitate the creation of a healthy and
democratic polity that can be used as a model for other Arab countries.

<P><B>Themes of the Conference:</B>
 <BR>- Democracy and Mental Health
 <BR>- Religion and Democracy
 <BR>- Media and Democracy
 <BR>- Socialization and Democracy
 <BR>- Democracy and the Family
 <BR>- The Role of Civil Society
 <BR>- Democracy and Human Rights
 <BR>- Women, Equality, and Participation
 <BR>- The West and Democracy in the Arab world
 <BR>- Democracy and Rule of Law
 <BR>- War, Trauma, and Democracy
 <BR>- Economic Development and Democracy
 <BR>- Democracy in Politics -->
